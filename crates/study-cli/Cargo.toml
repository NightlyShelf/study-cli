[package]
name = "study-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "study"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
html2text = "0.17.4"
indicatif = "0.18.6"
nucleo-matcher = "0.3.1"
open = "5.4.4"
ratatui = "0.30.2"
reqwest.workspace = true
study-core = { path = "../study-core" }
study-graph = { version = "0.1.0", path = "../study-graph" }
study-moodle = { path = "../study-moodle" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
